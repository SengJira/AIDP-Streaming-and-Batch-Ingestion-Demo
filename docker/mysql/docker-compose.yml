# Customer 360 master data for the AIDP federated-query demo.
#
# Deliberately contains NO credentials: every secret is required from the
# environment with the ${VAR:?message} form, so the stack refuses to start with
# empty or missing passwords rather than silently creating a blank-password user.
#
#   cp docker/mysql/.env.example docker/mysql/.env   # then set real passwords
#   docker compose --env-file docker/mysql/.env -f docker/mysql/docker-compose.yml up -d
#
# The published port is bound to MYSQL_BIND_ADDRESS (default 0.0.0.0) on the
# demo host (primary 10.246.25.115, dual-homed) - the same host that runs the
# Kafka broker. The AIDP cluster cannot route to 10.246.25.x, so AIDP worker
# nodes connect to the AIDP-subnet address: 172.18.1.177:3306.

services:
  mysql:
    image: mysql:8.0.43
    container_name: js-mysql-customer360
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # NOTE: mysql_native_password is built in and enabled by default on
      # MySQL 8.0.x, so no server flag is needed here (the --mysql-native-password
      # option only exists on 8.4+, where the plugin is off by default). The
      # read-only Starburst user is created with that plugin in
      # init/02_create_starburst_reader.sh, because the Trino MySQL connector
      # talks to it over a plaintext lab link and caching_sha2_password would
      # otherwise require TLS or allowPublicKeyRetrieval=true on the JDBC URL.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/mysql/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-customer360}
      # The MySQL entrypoint creates this user and grants it the database.
      MYSQL_USER: ${MYSQL_APP_USER:?set MYSQL_APP_USER in docker/mysql/.env}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in docker/mysql/.env}
      # Consumed by init/02_create_starburst_reader.sh (read-only account).
      MYSQL_STARBURST_USER: ${MYSQL_STARBURST_USER:?set MYSQL_STARBURST_USER in docker/mysql/.env}
      MYSQL_STARBURST_PASSWORD: ${MYSQL_STARBURST_PASSWORD:?set MYSQL_STARBURST_PASSWORD in docker/mysql/.env}
      TZ: UTC
    ports:
      - "${MYSQL_BIND_ADDRESS:-0.0.0.0}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_customer360_data:/var/lib/mysql
      # *.sql and *.sh here run once, only when the data volume is empty.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # CMD-SHELL + $$ so the password is expanded from the container's own
      # environment; it never lands in the compose file or `docker inspect`.
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u root --password="$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_customer360_data:
    name: js_mysql_customer360_data
